<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Armpay - Utility Bills</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .neon-blue-bg { background-color: #0077ff; }
        .app-bg { background-color: #f8fafc; }
    </style>
</head>
<body class="app-bg text-slate-600 font-sans pb-24">
    <header class="neon-blue-bg text-white p-4 sticky top-0 z-50 shadow-md">
        <div class="max-w-md mx-auto flex items-center space-x-3">
            <a href="dashboard.html" class="text-white hover:text-blue-100"><i class="fa-solid fa-arrow-left text-lg"></i></a>
            <h1 class="font-bold text-lg text-white">Pay Utility Bills</h1>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-4">
        <div class="bg-white p-5 rounded-2xl shadow-sm space-y-4">
            <form onsubmit="event.preventDefault(); alert('Insufficient balance to pay utility bill.');" class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">Select Biller / Electricity Disco</label>
                    <select class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-600 focus:ring-2 focus:ring-[#0077ff] focus:outline-none">
                        <option>AEDC (Abuja Electricity)</option>
                        <option>IKEDC (Ikeja Electric)</option>
                        <option>EKEDC (Eko Electricity)</option>
                        <option>KEDCO (Kano Electricity)</option>
                        <option>PHED (Port Harcourt Electric)</option>
                        <option>IBEDC (Ibadan Electricity)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">Meter / Smartcard Number</label>
                    <input type="text" placeholder="Enter meter number" required class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-600 focus:ring-2 focus:ring-[#0077ff] focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">Amount (₦)</label>
                    <input type="number" placeholder="0.00" required class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-600 focus:ring-2 focus:ring-[#0077ff] focus:outline-none">
                </div>
                <button type="submit" class="w-full neon-blue-bg text-white py-3 rounded-xl font-bold text-sm shadow-md hover:bg-blue-800 transition">
                    Pay Bill Now
                </button>
            </form>
        </div>
    </main>
</body>
</html>
