<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Armpay - Rewards</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .neon-blue-card { background: linear-gradient(135deg, #0077ff 0%, #00f0ff 100%); }
        .app-bg { background-color: #f8fafc; }
    </style>
</head>
<body class="app-bg text-slate-600 font-sans pb-24">
    <header class="bg-[#0077ff] text-white p-4 sticky top-0 z-50 shadow-md">
        <div class="max-w-md mx-auto flex items-center space-x-3">
            <a href="dashboard.html" class="text-white hover:text-blue-100"><i class="fa-solid fa-arrow-left text-lg"></i></a>
            <h1 class="font-bold text-lg text-white">Cashback & Rewards</h1>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-4">
        <div class="neon-blue-card text-white p-6 rounded-2xl shadow-md space-y-3">
            <span class="bg-white/20 text-[10px] uppercase font-bold px-2 py-0.5 rounded">Daily Cashback</span>
            <h2 class="text-2xl font-black">Earn ₦500 Cash Bonus</h2>
            <p class="text-xs text-blue-100">Perform your first transfer or buy airtime to unlock your welcome reward.</p>
            <button onclick="alert('No active rewards to claim yet. Fund your account to qualify!')" class="bg-white text-blue-700 text-xs font-bold px-4 py-2.5 rounded-xl shadow hover:bg-blue-50 transition">
                Claim Reward
            </button>
        </div>
    </main>

    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 py-2 px-6 z-50 max-w-md mx-auto shadow-lg rounded-t-2xl">
        <div class="flex justify-between items-center text-center">
            <a href="dashboard.html" class="flex flex-col items-center text-slate-400 hover:text-[#0077ff] transition focus:outline-none"><i class="fa-solid fa-house text-lg"></i><span class="text-[10px] font-medium mt-1">Home</span></a>
            <a href="loan.html" class="flex flex-col items-center text-slate-400 hover:text-[#0077ff] transition focus:outline-none"><i class="fa-solid fa-hand-holding-dollar text-lg"></i><span class="text-[10px] font-medium mt-1">Loan</span></a>
            <a href="rewards.html" class="flex flex-col items-center text-[#0077ff] focus:outline-none font-bold"><i class="fa-solid fa-gift text-lg"></i><span class="text-[10px] mt-1">Rewards</span></a>
            <a href="me.html" class="flex flex-col items-center text-slate-400 hover:text-[#0077ff] transition focus:outline-none"><i class="fa-solid fa-user-gear text-lg"></i><span class="text-[10px] font-medium mt-1">Me</span></a>
        </div>
    </nav>
</body>
</html>
