<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Armpay - Add Money</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .neon-blue-bg { background-color: #0077ff; }
        .app-bg { background-color: #f8fafc; }
    </style>
</head>
<body class="app-bg text-slate-600 font-sans pb-24">
    <header class="neon-blue-bg text-white p-4 sticky top-0 z-50 shadow-md">
        <div class="max-w-md mx-auto flex items-center space-x-3">
            <a href="dashboard.html" class="text-white hover:text-blue-100"><i class="fa-solid fa-arrow-left text-lg"></i></a>
            <h1 class="font-bold text-lg text-white">Fund Your Account</h1>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-4">
        <div class="bg-white p-6 rounded-2xl shadow-sm space-y-4 text-center">
            <div class="w-16 h-16 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center text-2xl mx-auto shadow-inner">
                <i class="fa-solid fa-building-columns"></i>
            </div>
            <div>
                <h2 class="text-lg font-bold text-slate-700">Bank Transfer Funding</h2>
                <p class="text-xs text-slate-400 mt-1">Make a mobile or internet banking transfer from any Nigerian bank to your dedicated account below:</p>
            </div>
            <div class="bg-slate-50 p-4 rounded-xl text-center space-y-2 border border-blue-100">
                <p class="text-xs text-slate-400 uppercase font-semibold">Account Number</p>
                <p class="text-2xl font-black text-slate-800 tracking-wider">7000000000</p>
                <p class="text-xs font-bold text-blue-600">Armpay Microfinance Bank</p>
            </div>
            <p class="text-[11px] text-slate-400">Your account will be credited automatically within 5 minutes of transfer.</p>
        </div>
    </main>
</body>
</html>
