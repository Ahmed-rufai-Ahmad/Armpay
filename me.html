<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Armpay - Account Settings</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .app-bg { background-color: #f8fafc; }
    </style>
</head>
<body class="app-bg text-slate-600 font-sans pb-24">
    <header class="bg-[#0077ff] text-white p-4 sticky top-0 z-50 shadow-md">
        <div class="max-w-md mx-auto flex items-center space-x-3">
            <a href="dashboard.html" class="text-white hover:text-blue-100"><i class="fa-solid fa-arrow-left text-lg"></i></a>
            <h1 class="font-bold text-lg text-white">My Profile & Settings</h1>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-4">
        <div class="bg-white p-5 rounded-2xl shadow-sm flex items-center space-x-4">
            <div class="w-14 h-14 bg-blue-100 text-blue-700 rounded-full flex items-center justify-center font-bold text-xl">
                <i class="fa-solid fa-user"></i>
            </div>
            <div>
                <h3 class="font-bold text-slate-700 text-base">Armpay User</h3>
                <p class="text-xs text-slate-400">+234 800 000 0000</p>
                <span class="inline-block bg-blue-100 text-blue-800 text-[10px] font-bold px-2 py-0.5 rounded-full mt-1">Tier 1 Account</span>
            </div>
        </div>

        <div class="bg-white rounded-2xl shadow-sm overflow-hidden divide-y divide-slate-100 text-sm">
            <button onclick="alert('Account Number: 7000000000\nBank: Armpay Microfinance Bank')" class="w-full flex items-center justify-between p-4 hover:bg-slate-50 transition text-left">
                <div class="flex items-center space-x-3 text-slate-600"><i class="fa-solid fa-id-card text-[#0077ff] w-5"></i><span>Account Details / Number</span></div>
                <i class="fa-solid fa-chevron-right text-xs text-slate-400"></i>
            </button>
            <button onclick="alert('Transaction PIN settings enabled.')" class="w-full flex items-center justify-between p-4 hover:bg-slate-50 transition text-left">
                <div class="flex items-center space-x-3 text-slate-600"><i class="fa-solid fa-shield-keyhole text-[#0077ff] w-5"></i><span>Security & Transaction PIN</span></div>
                <i class="fa-solid fa-chevron-right text-xs text-slate-400"></i>
            </button>
            <button onclick="alert('Bank verification status: BVN linked successfully.')" class="w-full flex items-center justify-between p-4 hover:bg-slate-50 transition text-left">
                <div class="flex items-center space-x-3 text-slate-600"><i class="fa-solid fa-user-check text-[#0077ff] w-5"></i><span>BVN & NIN Verification</span></div>
                <i class="fa-solid fa-chevron-right text-xs text-slate-400"></i>
            </button>
            <button onclick="alert('Customer Support: Call 0700-ARMPAY or chat with in-app support bot.')" class="w-full flex items-center justify-between p-4 hover:bg-slate-50 transition text-left">
                <div class="flex items-center space-x-3 text-slate-600"><i class="fa-solid fa-headset text-[#0077ff] w-5"></i><span>Customer Support / Help</span></div>
                <i class="fa-solid fa-chevron-right text-xs text-slate-400"></i>
            </button>
            <button onclick="window.location.href='index.html'" class="w-full flex items-center justify-between p-4 hover:bg-rose-50 transition text-left text-rose-600 font-medium">
                <div class="flex items-center space-x-3"><i class="fa-solid fa-right-from-bracket w-5"></i><span>Sign Out / Log Out</span></div>
                <i class="fa-solid fa-chevron-right text-xs text-rose-400"></i>
            </button>
        </div>
    </main>

    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 py-2 px-6 z-50 max-w-md mx-auto shadow-lg rounded-t-2xl">
        <div class="flex justify-between items-center text-center">
            <a href="dashboard.html" class="flex flex-col items-center text-slate-400 hover:text-[#0077ff] transition focus:outline-none"><i class="fa-solid fa-house text-lg"></i><span class="text-[10px] font-medium mt-1">Home</span></a>
            <a href="loan.html" class="flex flex-col items-center text-slate-400 hover:text-[#0077ff] transition focus:outline-none"><i class="fa-solid fa-hand-holding-dollar text-lg"></i><span class="text-[10px] font-medium mt-1">Loan</span></a>
            <a href="rewards.html" class="flex flex-col items-center text-slate-400 hover:text-[#0077ff] transition focus:outline-none"><i class="fa-solid fa-gift text-lg"></i><span class="text-[10px] font-medium mt-1">Rewards</span></a>
            <a href="me.html" class="flex flex-col items-center text-[#0077ff] focus:outline-none font-bold"><i class="fa-solid fa-user-gear text-lg"></i><span class="text-[10px] mt-1">Me</span></a>
        </div>
    </nav>
</body>
</html>
