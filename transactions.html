<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Armpay - History</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .neon-blue-bg { background-color: #0077ff; }
        .app-bg { background-color: #f8fafc; }
    </style>
</head>
<body class="app-bg text-slate-600 font-sans pb-24">
    <header class="neon-blue-bg text-white p-4 sticky top-0 z-50 shadow-md">
        <div class="max-w-md mx-auto flex items-center space-x-3">
            <a href="dashboard.html" class="text-white hover:text-blue-100"><i class="fa-solid fa-arrow-left text-lg"></i></a>
            <h1 class="font-bold text-lg text-white">Transaction History</h1>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-4">
        <div class="bg-white p-6 rounded-2xl shadow-sm text-center py-16">
            <i class="fa-solid fa-receipt text-slate-300 text-4xl mb-3"></i>
            <p class="text-sm text-slate-500 font-medium">No recent transactions yet</p>
            <p class="text-xs text-slate-400 mt-1">Your transaction logs will appear here once you start using your account.</p>
        </div>
    </main>
</body>
</html>
