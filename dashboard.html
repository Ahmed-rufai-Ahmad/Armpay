<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Armpay - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .neon-blue-bg { background-color: #0077ff; }
        .neon-blue-card { background: linear-gradient(135deg, #0077ff 0%, #00f0ff 100%); }
        .emerald-white-bg { background-color: #ffffff; }
        .app-bg { background-color: #f8fafc; }
    </style>
</head>
<body class="app-bg text-slate-600 font-sans pb-24">

    <!-- Top App Header -->
    <header class="neon-blue-bg text-white p-4 sticky top-0 z-50 shadow-md">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-white text-blue-600 rounded-full flex items-center justify-center font-black text-xl shadow">
                    A
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight text-white">Armpay</h1>
                    <p class="text-xs text-blue-100">We are beyond banking 🇳🇬</p>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <a href="index.html" class="bg-rose-600/80 px-3 py-1.5 rounded-full text-xs font-bold text-white hover:bg-rose-600 transition">Logout</a>
            </div>
        </div>
    </header>

    <!-- Main Mobile Container View -->
    <main class="max-w-md mx-auto p-4 space-y-4">
        <!-- Wallet / Balance Card -->
        <div class="neon-blue-card text-white p-6 rounded-2xl shadow-lg relative overflow-hidden">
            <div class="absolute -right-6 -bottom-6 w-32 h-32 bg-white/10 rounded-full pointer-events-none"></div>
            <div class="flex justify-between items-center mb-2">
                <span class="text-xs text-blue-100 uppercase tracking-wider font-medium">Available Balance</span>
                <button onclick="toggleBalance()" id="hideBtn" class="text-xs bg-blue-800/50 px-2 py-1 rounded-md text-blue-100 hover:bg-blue-800 transition">
                    <i class="fa-solid fa-eye mr-1" id="eyeIcon"></i> <span id="hideText">Hide</span>
                </button>
            </div>
            <div class="flex items-baseline space-x-2 mb-6">
                <span id="balanceDisplay" class="text-3xl md:text-4xl font-extrabold tracking-tight text-white">₦ 0.00</span>
            </div>
            
            <!-- Action Buttons inside Card -->
            <div class="grid grid-cols-2 gap-3 pt-3 border-t border-blue-400/40">
                <button onclick="openAddMoneyModal()" class="emerald-white-bg text-blue-700 py-2 rounded-xl text-xs font-bold shadow hover:bg-blue-50 transition flex items-center justify-center space-x-1.5">
                    <i class="fa-solid fa-plus-circle"></i>
                    <span>Add Money</span>
                </button>
                <a href="transfer.html" class="bg-blue-900 text-white py-2 rounded-xl text-xs font-bold shadow hover:bg-blue-950 transition flex items-center justify-center space-x-1.5">
                    <i class="fa-solid fa-arrow-right-arrow-left"></i>
                    <span>Transfer</span>
                </a>
            </div>
        </div>

        <!-- Quick Action Grid -->
        <div class="emerald-white-bg p-4 rounded-2xl shadow-sm grid grid-cols-4 gap-4 text-center">
            <a href="transfer.html" class="flex flex-col items-center group focus:outline-none">
                <div class="w-12 h-12 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center text-xl mb-1.5 group-hover:bg-[#0077ff] group-hover:text-white transition shadow-sm">
                    <i class="fa-solid fa-arrow-right-arrow-left"></i>
                </div>
                <span class="text-xs font-medium text-slate-600">Transfer</span>
            </a>
            <button onclick="openServiceModal('Airtime & Data')" class="flex flex-col items-center group focus:outline-none">
                <div class="w-12 h-12 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center text-xl mb-1.5 group-hover:bg-[#0077ff] group-hover:text-white transition shadow-sm">
                    <i class="fa-solid fa-mobile-screen"></i>
                </div>
                <span class="text-xs font-medium text-slate-600">Airtime</span>
            </button>
            <button onclick="openServiceModal('Betting Funding')" class="flex flex-col items-center group focus:outline-none">
                <div class="w-12 h-12 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center text-xl mb-1.5 group-hover:bg-[#0077ff] group-hover:text-white transition shadow-sm">
                    <i class="fa-solid fa-futbol"></i>
                </div>
                <span class="text-xs font-medium text-slate-600">Betting</span>
            </button>
            <button onclick="openServiceModal('Utility Bills')" class="flex flex-col items-center group focus:outline-none">
                <div class="w-12 h-12 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center text-xl mb-1.5 group-hover:bg-[#0077ff] group-hover:text-white transition shadow-sm">
                    <i class="fa-solid fa-lightbulb"></i>
                </div>
                <span class="text-xs font-medium text-slate-600">Bills</span>
            </button>
        </div>

        <!-- Transaction History Button Card -->
        <div class="emerald-white-bg p-4 rounded-2xl shadow-sm flex justify-between items-center">
            <h3 class="font-bold text-slate-700 text-sm">Transaction History</h3>
            <a href="transactions.html" class="text-xs bg-blue-50 text-blue-600 font-bold px-3 py-1.5 rounded-lg hover:bg-blue-100 transition inline-flex items-center">
                <i class="fa-solid fa-list-ul mr-1"></i> View History
            </a>
        </div>
    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="fixed bottom-0 left-0 right-0 emerald-white-bg border-t border-slate-200 py-2 px-6 z-50 max-w-md mx-auto shadow-lg rounded-t-2xl">
        <div class="flex justify-between items-center text-center">
            <a href="dashboard.html" class="flex flex-col items-center text-[#0077ff] focus:outline-none font-bold">
                <i class="fa-solid fa-house text-lg"></i>
                <span class="text-[10px] mt-1">Home</span>
            </a>
            <a href="loan.html" class="flex flex-col items-center text-slate-400 hover:text-[#0077ff] transition focus:outline-none">
                <i class="fa-solid fa-hand-holding-dollar text-lg"></i>
                <span class="text-[10px] font-medium mt-1">Loan</span>
            </a>
            <a href="rewards.html" class="flex flex-col items-center text-slate-400 hover:text-[#0077ff] transition focus:outline-none">
                <i class="fa-solid fa-gift text-lg"></i>
                <span class="text-[10px] font-medium mt-1">Rewards</span>
            </a>
            <a href="me.html" class="flex flex-col items-center text-slate-400 hover:text-[#0077ff] transition focus:outline-none">
                <i class="fa-solid fa-user-gear text-lg"></i>
                <span class="text-[10px] font-medium mt-1">Me</span>
            </a>
        </div>
    </nav>

    <!-- Interactive Logic Script -->
    <script>
        let isBalanceHidden = false;
        const actualBalance = "₦ 0.00";

        function toggleBalance() {
            isBalanceHidden = !isBalanceHidden;
            const balanceEl = document.getElementById('balanceDisplay');
            const eyeIcon = document.getElementById('eyeIcon');
            const hideText = document.getElementById('hideText');

            if (isBalanceHidden) {
                balanceEl.innerText = "₦ •••••••";
                eyeIcon.className = "fa-solid fa-eye-slash mr-1";
                hideText.innerText = "Show";
            } else {
                balanceEl.innerText = actualBalance;
                eyeIcon.className = "fa-solid fa-eye mr-1";
                hideText.innerText = "Hide";
            }
        }

        function openAddMoneyModal() {
            alert("To fund your Armpay account, transfer any amount to your dedicated account number: 7000000000 (Armpay MFB).");
        }

        function openServiceModal(serviceName) {
            alert("Please fund your account to use " + serviceName);
        }
    </script>

</body>
</html>
