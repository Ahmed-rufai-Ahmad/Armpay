<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Armpay - Loans</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .neon-blue-bg { background-color: #0077ff; }
        .app-bg { background-color: #f8fafc; }
    </style>
</head>
<body class="app-bg text-slate-600 font-sans pb-24">
    <header class="neon-blue-bg text-white p-4 sticky top-0 z-50 shadow-md">
        <div class="max-w-md mx-auto flex items-center space-x-3">
            <a href="dashboard.html" class="text-white hover:text-blue-100"><i class="fa-solid fa-arrow-left text-lg"></i></a>
            <h1 class="font-bold text-lg text-white">Instant Loans</h1>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-4">
        <div class="bg-white p-6 rounded-2xl shadow-sm space-y-4 text-center">
            <div class="w-16 h-16 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center text-2xl mx-auto shadow-inner">
                <i class="fa-solid fa-hand-holding-dollar"></i>
            </div>
            <div>
                <h2 class="text-xl font-black text-slate-700">Armpay Instant Loans</h2>
                <p class="text-xs text-slate-500 mt-1">Get up to ₦100,000 instant cash directly to your account with zero collateral.</p>
            </div>
            <div class="bg-slate-50 p-4 rounded-xl text-left space-y-2">
                <div class="flex justify-between text-xs"><span class="text-slate-500">Maximum Limit:</span><span class="font-bold text-slate-700">₦100,000</span></div>
                <div class="flex justify-between text-xs"><span class="text-slate-500">Interest Rate:</span><span class="font-bold text-blue-600">Low as 3%</span></div>
                <div class="flex justify-between text-xs"><span class="text-slate-500">Tenure:</span><span class="font-bold text-slate-700">1 - 3 Months</span></div>
            </div>
            <button onclick="alert('Loan eligibility check: Complete your profile verification in the Me tab first.')" class="w-full neon-blue-bg text-white py-3 rounded-xl font-bold text-sm shadow hover:bg-blue-800 transition">
                Check Loan Eligibility
            </button>
        </div>
    </main>

    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 py-2 px-6 z-50 max-w-md mx-auto shadow-lg rounded-t-2xl">
        <div class="flex justify-between items-center text-center">
            <a href="dashboard.html" class="flex flex-col items-center text-slate-400 hover:text-[#0077ff] transition focus:outline-none"><i class="fa-solid fa-house text-lg"></i><span class="text-[10px] font-medium mt-1">Home</span></a>
            <a href="loan.html" class="flex flex-col items-center text-[#0077ff] focus:outline-none font-bold"><i class="fa-solid fa-hand-holding-dollar text-lg"></i><span class="text-[10px] mt-1">Loan</span></a>
            <a href="rewards.html" class="flex flex-col items-center text-slate-400 hover:text-[#0077ff] transition focus:outline-none"><i class="fa-solid fa-gift text-lg"></i><span class="text-[10px] font-medium mt-1">Rewards</span></a>
            <a href="me.html" class="flex flex-col items-center text-slate-400 hover:text-[#0077ff] transition focus:outline-none"><i class="fa-solid fa-user-gear text-lg"></i><span class="text-[10px] font-medium mt-1">Me</span></a>
        </div>
    </nav>
</body>
</html>
